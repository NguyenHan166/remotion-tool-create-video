name: hansys-video-studio-dev

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hansys_video}
      POSTGRES_USER: ${POSTGRES_USER:-hansys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hansys_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hansys} -d ${POSTGRES_DB:-hansys_video}"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_dev_data:
